<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e4976"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo do documento fiscal -->
  <rect x="6" y="4" width="52" height="56" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="6" y="4" width="52" height="56" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Faixa Dourada SEFAZ -->
  <path d="M 6 16 Q 6 4 18 4 L 46 4 Q 58 4 58 16 L 58 20 L 6 20 Z" fill="url(#goldGrad)"/>

  <!-- Linhas do documento -->
  <line x1="16" y1="12" x2="48" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="14" y1="46" x2="50" y2="46" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="51" x2="38" y2="51" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Texto Central NFE -->
  <text x="32" y="37" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NF-e</text>

  <!-- Badge de Autenticidade / Selo Verde SEFAZ -->
  <circle cx="49" cy="49" r="5.5" fill="#10b981" stroke="#0f2b48" stroke-width="1.5"/>
  <path d="M 46.5 49 L 48.2 50.8 L 51.5 47.2" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>